<nz-layout class="app-layout">
  <nz-header class="header-row" [ngClass]="theme">
    <div id="welcome" class="logo" [ngClass]="theme">
      <a class="logo-row site-brand" routerLink="/welcome">
        <nz-icon class="dotnet-icon" nzType="dot-net" nzTheme="outline" />
        <h1 class="text-color text-header-case" [ngClass]="theme">MAXICRAFT</h1>
      </a>
    </div>

    <div class="mobile-nav-toggle">
      <button type="button" class="mobile-nav-button" [attr.aria-label]="'MenuLabel' | translate"
              (click)="showSideMenu = !showSideMenu">
        <nz-icon nzType="menu" nzTheme="outline" />
      </button>
      <nz-drawer nzPlacement="right" [nzClosable]="false" [nzVisible]="showSideMenu"
                 (nzOnClose)="showSideMenu = false">
        <ng-container *nzDrawerContent>
          <ul nz-menu nzMode="horizontal" class="top-nav mobile-menu-bar" [nzTheme]="theme">
            @for (link of nav; track link.path) {
              <li nz-menu-item class="text-color text-header-case" [ngClass]="theme"
                  [routerLink]="link.path" (click)="showSideMenu = false">
                <a>{{ link.title | translate }}</a>
              </li>
            }
          </ul>
        </ng-container>
      </nz-drawer>
    </div>

    <ul nz-menu nzMode="horizontal" class="top-nav" [nzTheme]="theme">
      @for (link of nav; track link.path) {
        <li nz-menu-item class="text-color text-header-case" [ngClass]="theme"
            [routerLink]="link.path">
          <a>{{ link.title | translate }}</a>
        </li>
      }
    </ul>

    <div class="switch-light">
      <nz-switch class="lighter" [ngModel]="isNight" (ngModelChange)="changeTheme($event)"
                 [nzCheckedChildren]="checkedTemplate" [nzUnCheckedChildren]="unCheckedTemplate" />
    </div>
    <div>
      <a nz-dropdown [nzDropdownMenu]="menu" tabindex="0" [attr.aria-label]="'LanguageLabel' | translate">
        <nz-icon style="margin-right: 10px" nzType="global" nzTheme="outline" />
        <nz-icon nzType="down" />
      </a>
      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu nzSelectable>
          <li nz-menu-item [nzSelected]="activeLang === 'ru'" (click)="selectLang('ru')">RU</li>
          <li nz-menu-item [nzSelected]="activeLang === 'en'" (click)="selectLang('en')">ENG</li>
        </ul>
      </nz-dropdown-menu>
    </div>
    <div>
      <button type="button" nz-button nzType="primary" nzSize="large" (click)="openContact()">
        {{ 'GetInTouch' | translate }}
      </button>
    </div>
    <ng-template #checkedTemplate><nz-icon nzType="moon" /></ng-template>
    <ng-template #unCheckedTemplate><nz-icon nzType="sun" /></ng-template>
  </nz-header>
  <nz-content>
    <div class="inner-content" [class.dark-theme]="isNight">
      <router-outlet />
    </div>
  </nz-content>
</nz-layout>
